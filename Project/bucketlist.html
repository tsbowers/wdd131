<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Browse Utah's national parks, state parks, and LDS temples by region. Save your favorites to your personal bucket list." />
  <title>Bucket List — Utah Vacation Planner</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- HEADER / NAV -->
  <header>
    <nav>
      <a href="index.html" class="nav-logo">Utah Vacation Planner</a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="bucketlist.html" class="active">Bucket List</a></li>
        <li><a href="reviews.html">Reviews</a></li>
      </ul>
    </nav>
  </header>

  <!-- PAGE HERO -->
  <div class="page-hero" role="banner">
    <h1>Utah Bucket List</h1>
    <p>Browse parks and temples by region - save what you want to visit</p>
  </div>

  <main class="section">

    <!-- SAVED LIST PANEL -->
    <div class="saved-panel" role="region" aria-label="Your saved bucket list">
      <h2>&#9733; My Bucket List (<span id="saved-count">0</span>)</h2>
      <ul id="saved-list" aria-live="polite">
        <li class="saved-empty" id="saved-empty-msg">No destinations saved yet. Click "Add" to start your list!</li>
      </ul>
      <button class="btn btn-outline" id="clear-list-btn" style="display:none;" aria-label="Clear all saved destinations">Clear All</button>
    </div>

    <!-- FILTER BAR -->
    <div class="filter-bar" role="group" aria-label="Filter destinations">
      <label>Filter by:</label>
      <button class="filter-btn active" data-filter="all">All</button>
      <button class="filter-btn" data-filter="northern">Northern Utah</button>
      <button class="filter-btn" data-filter="central">Central Utah</button>
      <button class="filter-btn" data-filter="southern">Southern Utah</button>
      <button class="filter-btn" data-filter="national">National Parks</button>
      <button class="filter-btn" data-filter="state">State Parks</button>
      <button class="filter-btn" data-filter="temple">Temples</button>
    </div>

    <!-- DESTINATION LIST — injected by JS -->
    <div id="destinations-container" aria-live="polite"></div>

  </main>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 Utah Vacation Planner - WDD 131 - <a href="references.html">References</a></p>
  </footer>

  <script src="bucketlist.js"></script>
</body>
</html>
